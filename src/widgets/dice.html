<meta name="tw-bot" content="persona-d10">
<style>
:root{--hint:var(--tg-theme-hint-color);--ink:#171717;--paper:#d8b2ff;--accent:#fd630c}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;color:var(--tg-theme-text-color);background:transparent;font:14px/1.3 Verdana,sans-serif}
.head{display:flex;align-items:center;margin-bottom:12px}.title{font-size:13px;font-weight:700;letter-spacing:.05em}.tag{margin-left:auto;color:var(--hint);font:11px monospace}
.play{display:flex;align-items:center;gap:16px;margin-bottom:13px}.frame{flex:0 0 128px;width:128px;height:140px;padding:2px;background:var(--ink);clip-path:polygon(50% 0,100% 36%,78% 100%,22% 100%,0 36%)}
.d10{width:100%;height:100%;display:grid;place-items:center;background:var(--paper);clip-path:inherit}canvas{width:112px;height:112px;image-rendering:pixelated;transform:translateY(-3px)}
.result{min-width:0}.label{color:var(--hint);font:700 10px monospace;letter-spacing:.06em}.name{margin:4px 0 5px;font-size:18px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}.desc{color:var(--hint);font-size:13px;line-height:1.35}
.roll{width:100%;min-height:44px;border:2px solid var(--ink);border-radius:0;background:var(--accent);color:var(--ink);font:700 14px Verdana,sans-serif;cursor:pointer;touch-action:none;transition:transform .12s,opacity .12s}
.roll:hover:not([disabled]){transform:translateY(-2px)}.roll:active{transform:translateY(0)}.roll:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.roll[disabled]{cursor:default;opacity:.6}
.status{min-height:17px;margin-top:7px;color:var(--hint);font-size:11px;text-align:center}.status.error{color:var(--tg-theme-destructive-text-color)}
.landed{animation:land .24s ease-out}@keyframes land{0%{transform:translateY(-5px);opacity:.6}100%{transform:none;opacity:1}}
@media(max-width:240px){body{padding:10px}.play{gap:10px}.frame{flex-basis:104px;width:104px;height:116px}canvas{width:88px;height:88px}.name{font-size:16px}.desc{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="head"><span class="title">ЛИЧНОСТЬ ДНЯ</span><span class="tag">D10 · 00:00 МСК</span></div>
<div class="play"><div class="frame"><div class="d10" id="d10"><canvas id="face" width="24" height="24" role="img" aria-label="Личность ещё не раскрыта"></canvas></div></div>
<div class="result"><div class="label">ТВОЙ СОБЕСЕДНИК</div><div class="name" id="name">Пока секрет</div><div class="desc" id="desc">Брось d10 — личность закрепится до полуночи.</div></div></div>
<button class="roll" id="roll">Узнать личность</button><div class="status" id="status" aria-live="polite"></div>
<script>
const T=window.TelegramWidget,$=id=>document.getElementById(id),button=$('roll'),ctx=$('face').getContext('2d');
const sprites={
kolyan:'................/....########..../...##########.../..############../..############../...#........#.../...#..#..#..#.../...#........#.../...#...##...#.../....#......#..../.....######...../...##########.../..##...##...##../.##....##....##./##.....##.....##/................',
artvednik:'................/.....#.#.#.#..../....#########.../...##.###.###.../..###.......##../..##..#..#..##../..##........##../..##...##...##../...#........#.../...#..####..#.../....#......#..../.....######...../...##########.../..##..####..##../.##...####...##./................',
filosof:'................/......####....../.....#....#...../....#......#..../....#......#..../...##.####.##.../...#.#....#.#.../...##.####.##.../....#......#..../....#..##..#..../.....#....#...../.....######...../....########..../...##.######..../..##...####...../................',
masha:'................/.....######...../....########..../...##########.../..###......###../..##..#..#..##../..##........##../..##...##...##../..##..####..##../..###......###../..####....####../..###.####.###../..##...##...##../..##..####..##../.###........###./................',
polkovnik:'................/.....######...../...##########.../..############../....########..../...#........#.../...#..#..#..#.../...#........#.../...#..####..#.../....#......#..../.....######...../...##########.../..##.#.##.#.##../.##..######..##./##....####....##/................',
vitya:'................/.......##......./......####....../.....######...../....##....##..../....#......#..../....#.#..#.#..../....#......#..../....#..##..#..../.....#....#...../......####....../.....######...../....##.##.##..../...##..##..##.../..##...##...##../................',
professor:'................/.....######...../....########..../...##......##.../...#........#.../...#.####..##.../...#.#..#...#.../...##....####.../....#......#..../....#..##..#..../.....######...../....########..../...##..##..##.../..##...##...##../.##....##....##./................',
rapper:'................/....########..../...##########.../..############../....########..../...#........#.../...##########.../...##..##..##.../...#........#.../....#..##..#..../.....######...../...##########.../..##...##...##../.##....##....##./##....####....##/................',
detective:'................/......####....../....########..../..############../.##############./.....######...../....#......#..../....#.#..#.#..../....#......#..../.....#..#.#...../......####....../...##########.../..##..####..##../.##...####...##./##.....##.....##/................',
babushka:'................/.....######...../....########..../...##########.../..############../..##........##../..##.#....#.##../..##........##../..###..##..###../..####....####../...##########.../....########..../...##.####.##.../..##...##...##../.##...####...##./................',
unknown:'................/................/.....######...../....##....##..../...##......##.../...........##.../..........##..../.........##...../........##....../........##....../................/........##....../........##....../................/................/................'};
const colors={kolyan:['#7a4a2b','#efbd8f','#56733a'],artvednik:['#292524','#efbd8f','#b45309'],filosof:['#d6d3d1','#e7b98c','#57534e'],masha:['#78350f','#f2c39b','#be5b83'],polkovnik:['#44403c','#dca57e','#4d5b43'],vitya:['#6b4226','#f2c39b','#3b82a0'],professor:['#57534e','#e7b98c','#e5e7eb'],rapper:['#171717','#c98f68','#7c3f58'],detective:['#292524','#dca57e','#57534e'],babushka:['#d6d3d1','#e7b98c','#9a5978']};
const ids=Object.keys(colors),errors={NOT_ALLOWED:'Здесь раскрыть нельзя',BUSY:'Уже выбираем',RATE_LIMITED:'Слишком быстро. Секундочку',TIMEOUT:'Билли не ответил. Попробуй ещё раз',FAILED:'Связь с Билли пропала. Попробуй ещё раз',INVALID_ANSWER:'Билли ответил что-то странное'};
let busy=false,timer=0;
function draw(id){const rows=sprites[id]||sprites.unknown,p=colors[id]||['#57534e','#efbd8f','#57534e'];ctx.fillStyle='#d8b2ff';ctx.fillRect(0,0,24,24);if(id!=='unknown'){ctx.fillStyle=p[2];ctx.fillRect(6,15,12,7);ctx.fillStyle=p[1];ctx.fillRect(7,7,10,9)}rows.split('/').forEach((row,y)=>Array.from(row).forEach((v,x)=>{if(v!=='#')return;ctx.fillStyle=id==='unknown'?'#171717':y<5?p[0]:y>10?p[2]:'#171717';ctx.fillRect(x+4,y+4,1,1)}));$('face').setAttribute('aria-label',id==='unknown'?'Личность ещё не раскрыта':$('name').textContent)}
function status(text,error){$('status').textContent=text||'';$('status').className=error?'status error':'status'}
function setBusy(value){busy=value;button.disabled=value;button.textContent=value?'Выбираем…':button.dataset.done?'Показать личность':'Узнать личность'}
function haptic(kind,value){try{T.HapticFeedback[kind](value)}catch(e){}}
function parse(text){try{return JSON.parse(text||'{}')}catch(e){return{}}}
button.onclick=()=>{if(busy)return;setBusy(true);status('');haptic('impactOccurred','light');let i=0;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>draw(ids[i++%10]),70);
  Promise.all([T.request('persona:v1'),new Promise(r=>setTimeout(r,700))]).then(([answer])=>{const data=parse(answer.result);if(!colors[data.id])throw{message:data.err||errors.INVALID_ANSWER};
    $('name').textContent=String(data.name||'').slice(0,80);$('desc').textContent=String(data.description||'').slice(0,120);draw(data.id);$('d10').classList.add('landed');button.dataset.done='1';status((data.existing?'Уже назначена':'Назначена')+' до 00:00 МСК · только для тебя');haptic('notificationOccurred','success')})
  .catch(error=>{status(error.message||errors[error.code]||errors.FAILED,true);haptic('notificationOccurred','error')})
  .finally(()=>{clearInterval(timer);setBusy(false)})};
const can=!!(T&&T.viewer&&!T.isPreview&&!T.isForward);draw('unknown');if(!can){button.disabled=true;button.textContent='Только просмотр';if(T&&T.isForward)status('В пересланной копии — без выбора личности')}if(T)T.ready&&T.ready();
</script>
